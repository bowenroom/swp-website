# Caps the journal so it cannot grow without bound.
#
# This host had no limits at all -- /etc/systemd/journald.conf was empty and the
# journal had reached 982M on a 50G disk. Install as
# /etc/systemd/journald.conf.d/10-size.conf, then restart journald (or reboot).
[Journal]
SystemMaxUse=200M
SystemKeepFree=1G
SystemMaxFileSize=50M
MaxRetentionSec=2week
