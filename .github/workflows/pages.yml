name: Deploy site to GitHub Pages

# Publishes the Astro build output (dist/). The legacy hand-written prototype/
# and the 62 MB of archived v1 footage in archive/ stay out of the bundle.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race: a newer push supersedes an in-flight build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The skeleton suite builds the site and asserts on the emitted HTML:
      # 12 bilingual routes, bidirectional language switch, canonical/hreflang,
      # and Kami tokens in the shared layout. Run it before publishing so a
      # broken skeleton can never reach Pages.
      - name: Test
        run: npm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
